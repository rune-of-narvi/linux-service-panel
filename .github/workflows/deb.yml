name: Ubuntu 24.04

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential debhelper pkg-config libgtk-4-dev libadwaita-1-dev libgtest-dev desktop-file-utils
      - name: Build, install, and check the package
        id: build
        shell: bash
        run: |
          version=$(dpkg-parsechangelog --show-field Version)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The release tag must match debian/changelog (v$version)." >&2
            exit 1
          fi

          dpkg-buildpackage --build=binary --unsigned-changes --unsigned-source
          arch=$(dpkg --print-architecture)
          package="service-panel_${version}_${arch}.deb"
          dpkg-deb --info "../$package"
          if [[ "$version" == "0.5.0" ]]; then
            # Check the package-name migration against the last release under the old name.
            old_package="gnome-service-manager_0.4.4_${arch}.deb"
            curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.4.4/$old_package" \
              -o "$RUNNER_TEMP/$old_package"
            sudo apt-get install -y "$RUNNER_TEMP/$old_package"
          fi
          sudo apt-get install -y "../$package"
          test -x /usr/bin/service-panel
          test ! -e /usr/bin/gnome-service-manager
          test ! -e /usr/share/applications/local.GnomeServiceManager.desktop
          test -s /usr/share/doc/service-panel/copyright
          desktop-file-validate /usr/share/applications/local.ServicePanel.desktop
          test -s /usr/share/polkit-1/actions/local.ServicePanel.policy
          if service-panel --backend > root-check.log 2>&1; then
            echo "Expected the helper to reject a launch without root." >&2
            exit 1
          fi
          grep -F 'Service Panel helper requires root' root-check.log
          printf '00\n' | sudo /usr/bin/service-panel --backend > backend-check.log
          grep -qx 'READY' backend-check.log
          grep -q '^(true, ' backend-check.log

          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp "../$package" dist/
          latest_package=service-panel-latest.deb
          cp "dist/$package" "dist/$latest_package"
          (
            cd dist
            sha256sum "$package" > "$package.sha256"
            sha256sum "$latest_package" > "$latest_package.sha256"
          )
          dpkg-parsechangelog --show-field Changes |
            sed -e '1,3d' -e 's/^  \* /- /' -e 's/^    /  /' -e 's/^\.$//' > dist/release-notes.md
          grep -q '^- ' dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-amd64
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    concurrency:
      group: publish-release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-24.04-amd64
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi

          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ ! "$latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected the latest release to have a vMAJOR.MINOR.PATCH tag, got $latest." >&2
            exit 1
          fi
          next_patch="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          next_minor="v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
          if [[ "$tag" != "$next_patch" && "$tag" != "$next_minor" ]]; then
            echo "Expected the next release to be $next_patch or $next_minor, got $tag." >&2
            exit 1
          fi

          args=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args=(--verify-tag)
          fi
          gh release create "$tag" dist/*.deb dist/*.sha256 --repo "$GITHUB_REPOSITORY" \
            "${args[@]}" --title "$tag" --latest --notes-file dist/release-notes.md
