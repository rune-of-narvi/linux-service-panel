name: Ubuntu 26.04

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev libgtest-dev
      - name: Build and run tests
        run: make -j2 service-panel test
